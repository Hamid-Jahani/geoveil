[package]
name = "geoveil-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
geoveil-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
netdev = "0"
# Interface-bound UDP sockets for the STUN leak probes.
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(windows)'.dependencies]
# Raw IP_UNICAST_IF / IPV6_UNICAST_IF (socket2 has no Windows wrapper).
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
tempfile = "3"
