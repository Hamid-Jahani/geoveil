name: Feature request
description: Suggest an idea or improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check docs/design.md first. Several features are already planned
        (Windows location spoofing, browser extension bridge, leak checks,
        macOS expert mode, tray UI).

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should Geoveil behave? Include commands or flags if relevant.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating systems affected
      multiple: true
      options:
        - Windows
        - Linux
        - macOS
        - All

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself.
