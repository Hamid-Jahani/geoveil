[workspace]
resolver = "2"
members = [
    "crates/geoveil-core",
    "crates/geoveil-platform",
    "crates/geoveil-cli",
    "crates/geoveil-ipc",
    "crates/geoveil-tray",
]
# A plain `cargo build` / `cargo test` skips the tray, which needs Rust 1.90,
# so the documented minimum (1.88) builds `geoveil`. CI, the release workflow
# and the docs pass `--workspace` or `-p geoveil-tray` to include it.
default-members = [
    "crates/geoveil-core",
    "crates/geoveil-platform",
    "crates/geoveil-cli",
    "crates/geoveil-ipc",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
geoveil-core = { path = "crates/geoveil-core" }
geoveil-platform = { path = "crates/geoveil-platform" }
geoveil-ipc = { path = "crates/geoveil-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
dirs = "7"
